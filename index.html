<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoMarket - Compra e Vendi Auto</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --dark: #0f172a;
            --light: #f8fafc;
            --gray: #64748b;
            --border: #e2e8f0;
            --success: #10b981;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--light);
            color: var(--dark);
            line-height: 1.6;
        }

        header {
            background-color: #ffffff;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--dark);
            text-decoration: none;
        }

        .logo span {
            color: var(--primary);
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.65rem 1.25rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 0.95rem;
        }

        .btn:hover {
            background-color: var(--primary-dark);
        }

        .btn-outline {
            background: transparent;
            color: var(--dark);
            border: 1px solid var(--border);
        }

        .btn-outline:hover {
            background: var(--light);
        }

        .btn-edit {
            background-color: #f1f5f9;
            color: var(--dark);
            border: 1px solid var(--border);
            padding: 0.55rem 0.85rem;
            width: 100%;
        }

        .btn-edit:hover {
            background-color: #e2e8f0;
        }

        .btn-delete {
            background-color: #fef2f2;
            color: var(--danger);
            border: 1px solid #fecaca;
            padding: 0.55rem 0.85rem;
            width: 100%;
        }

        .btn-delete:hover {
            background-color: var(--danger);
            color: white;
        }

        .hero {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: white;
            padding: 3.5rem 1.5rem;
            text-align: center;
        }

        .hero h1 {
            font-size: 2.25rem;
            margin-bottom: 0.75rem;
        }

        .hero p {
            color: #cbd5e1;
            max-width: 600px;
            margin: 0 auto 2rem;
        }

        .filters-bar {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            padding: 1rem;
            border-radius: 12px;
            display: grid;
            grid-template-columns: 2fr 1fr 1fr auto;
            gap: 0.75rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .filters-bar input, .filters-bar select {
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.95rem;
            width: 100%;
        }

        .container {
            max-width: 1200px;
            margin: 2.5rem auto;
            padding: 0 1.5rem;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .cars-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .car-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .car-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 20px rgba(0,0,0,0.06);
        }

        .badge-mine {
            position: absolute;
            top: 12px;
            left: 12px;
            background: var(--primary);
            color: white;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 0.25rem 0.65rem;
            border-radius: 20px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }

        .car-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background-color: #e2e8f0;
        }

        .car-body {
            padding: 1.25rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .car-price {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 0.25rem;
        }

        .car-title {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
        }

        .car-specs {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
            font-size: 0.85rem;
            color: var(--gray);
            margin-bottom: 1.25rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }

        .car-specs span {
            background: var(--light);
            padding: 0.25rem 0.6rem;
            border-radius: 6px;
        }

        .car-footer {
            margin-top: auto;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .owner-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 1rem;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: white;
            border-radius: 14px;
            max-width: 550px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 1.75rem;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 1.25rem;
            right: 1.25rem;
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--gray);
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 0.35rem;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 0.65rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.95rem;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
        }

        @media (max-width: 768px) {
            .filters-bar {
                grid-template-columns: 1fr;
            }
            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="#" class="logo">Auto<span>Market</span></a>
            <div>
                <button class="btn" onclick="openSellModal()">+ Vendi la tua Auto</button>
            </div>
        </div>
    </header>

    <section class="hero">
        <h1>Trova la tua prossima auto</h1>
        <p>Esplora centinaia di veicoli verificati o pubblica il tuo annuncio gratuitamente.</p>
        
        <div class="filters-bar">
            <input type="text" id="searchInput" placeholder="Cerca marca o modello..." oninput="filterCars()">
            <select id="fuelFilter" onchange="filterCars()">
                <option value="">Tutti i carburanti</option>
                <option value="Benzina">Benzina</option>
                <option value="Diesel">Diesel</option>
                <option value="Ibrida">Ibrida</option>
                <option value="Elettrica">Elettrica</option>
            </select>
            <select id="priceFilter" onchange="filterCars()">
                <option value="999999">Prezzo max: Qualsiasi</option>
                <option value="10000">Fino a 10.000 €</option>
                <option value="20000">Fino a 20.000 €</option>
                <option value="35000">Fino a 35.000 €</option>
                <option value="50000">Fino a 50.000 €</option>
            </select>
            <button class="btn btn-outline" onclick="resetFilters()">Reset</button>
        </div>
    </section>

    <main class="container">
        <div class="section-header">
            <h2>Annunci recenti (<span id="carCount">0</span>)</h2>
        </div>
        <div class="cars-grid" id="carsGrid"></div>
    </main>

    <!-- MODALE AGGIUNGI / MODIFICA -->
    <div class="modal-overlay" id="sellModal">
        <div class="modal">
            <button class="close-btn" onclick="closeModals()">&times;</button>
            <h2 id="modalTitle" style="margin-bottom: 1rem;">Pubblica un annuncio</h2>
            <form id="sellForm" onsubmit="saveCarForm(event)">
                <input type="hidden" id="editCarId" value="">
                <div class="form-row">
                    <div class="form-group">
                        <label>Marca *</label>
                        <input type="text" id="brand" required placeholder="es. Audi">
                    </div>
                    <div class="form-group">
                        <label>Modello *</label>
                        <input type="text" id="model" required placeholder="es. A3">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Prezzo (€) *</label>
                        <input type="number" id="price" required min="1" placeholder="es. 18500">
                    </div>
                    <div class="form-group">
                        <label>Anno *</label>
                        <input type="number" id="year" required min="1950" max="2026" placeholder="es. 2021">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Chilometri *</label>
                        <input type="number" id="km" required min="0" placeholder="es. 45000">
                    </div>
                    <div class="form-group">
                        <label>Carburante *</label>
                        <select id="fuel" required>
                            <option value="Benzina">Benzina</option>
                            <option value="Diesel">Diesel</option>
                            <option value="Ibrida">Ibrida</option>
                            <option value="Elettrica">Elettrica</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>URL Immagine (opzionale)</label>
                    <input type="url" id="image" placeholder="https://...">
                </div>
                <div class="form-group">
                    <label>Contatto WhatsApp / Telefono *</label>
                    <input type="tel" id="phone" required placeholder="es. 393331234567">
                </div>
                <div class="form-group">
                    <label>Descrizione</label>
                    <textarea id="description" rows="3" placeholder="Condizioni, optional..."></textarea>
                </div>
                <button type="submit" id="submitBtn" class="btn" style="width: 100%;">Pubblica Annuncio</button>
            </form>
        </div>
    </div>

    <!-- MODALE DETTAGLI -->
    <div class="modal-overlay" id="detailModal">
        <div class="modal" id="detailContent"></div>
    </div>
