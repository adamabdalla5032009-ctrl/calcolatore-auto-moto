<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoMarket - Compra e Vendi Auto</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --dark: #0f172a;
            --light: #f8fafc;
            --gray: #64748b;
            --border: #e2e8f0;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--light);
            color: var(--dark);
            line-height: 1.6;
        }

        /* Navbar */
        header {
            background-color: #ffffff;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--dark);
            text-decoration: none;
        }

        .logo span {
            color: var(--primary);
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.65rem 1.25rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 0.95rem;
        }

        .btn:hover {
            background-color: var(--primary-dark);
        }

        .btn-outline {
            background: transparent;
            color: var(--dark);
            border: 1px solid var(--border);
        }

        .btn-outline:hover {
            background: var(--light);
        }

        /* Hero & Search */
        .hero {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: white;
            padding: 3.5rem 1.5rem;
            text-align: center;
        }

        .hero h1 {
            font-size: 2.25rem;
            margin-bottom: 0.75rem;
        }

        .hero p {
            color: #cbd5e1;
            max-width: 600px;
            margin: 0 auto 2rem;
        }

        .filters-bar {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            padding: 1rem;
            border-radius: 12px;
            display: grid;
            grid-template-columns: 2fr 1fr 1fr auto;
            gap: 0.75rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .filters-bar input, .filters-bar select {
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.95rem;
            width: 100%;
        }

        /* Main Grid */
        .container {
            max-width: 1200px;
            margin: 2.5rem auto;
            padding: 0 1.5rem;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .cars-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .car-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
        }

        .car-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 20px rgba(0,0,0,0.06);
        }

        .car-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background-color: #e2e8f0;
        }

        .car-body {
            padding: 1.25rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .car-price {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 0.25rem;
        }

        .car-title {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
        }

        .car-specs {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
            font-size: 0.85rem;
            color: var(--gray);
            margin-bottom: 1.25rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }

        .car-specs span {
            background: var(--light);
            padding: 0.25rem 0.6rem;
            border-radius: 6px;
        }

        .car-footer {
            margin-top: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Modals */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 1rem;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: white;
            border-radius: 14px;
            max-width: 550px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 1.75rem;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 1.25rem;
            right: 1.25rem;
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--gray);
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 0.35rem;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 0.65rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.95rem;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .filters-bar {
                grid-template-columns: 1fr;
            }
            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="#" class="logo">Auto<span>Market</span></a>
            <div>
                <button class="btn" onclick="openSellModal()">+ Vendi la tua Auto</button>
            </div>
        </div>
    </header>

    <section class="hero">
        <h1>Trova la tua prossima auto</h1>
        <p>Esplora centinaia di veicoli verificati o pubblica il tuo annuncio gratuitamente in meno di un minuto.</p>
        
        <div class="filters-bar">
            <input type="text" id="searchInput" placeholder="Cerca marca o modello (es. BMW, Golf...)" oninput="filterCars()">
            <select id="fuelFilter" onchange="filterCars()">
                <option value="">Tutti i carburanti</option>
                <option value="Benzina">Benzina</option>
                <option value="Diesel">Diesel</option>
                <option value="Ibrida">Ibrida</option>
                <option value="Elettrica">Elettrica</option>
            </select>
            <select id="priceFilter" onchange="filterCars()">
                <option value="999999">Prezzo max: Qualsiasi</option>
                <option value="10000">Fino a 10.000 €</option>
                <option value="20000">Fino a 20.000 €</option>
                <option value="35000">Fino a 35.000 €</option>
                <option value="50000">Fino a 50.000 €</option>
            </select>
            <button class="btn btn-outline" onclick="resetFilters()">Reset</button>
        </div>
    </section>

    <main class="container">
        <div class="section-header">
            <h2>Annunci recenti (<span id="carCount">0</span>)</h2>
        </div>
        <div class="cars-grid" id="carsGrid">
            <!-- Le card verranno generate via JavaScript -->
        </div>
    </main>

    <!-- MODALE VENDI AUTO -->
    <div class="modal-overlay" id="sellModal">
        <div class="modal">
            <button class="close-btn" onclick="closeModals()">&times;</button>
            <h2 style="margin-bottom: 1rem;">Pubblica un annuncio</h2>
            <form id="sellForm" onsubmit="addCar(event)">
                <div class="form-row">
                    <div class="form-group">
                        <label>Marca *</label>
                        <input type="text" id="brand" required placeholder="es. Audi">
                    </div>
                    <div class="form-group">
                        <label>Modello *</label>
                        <input type="text" id="model" required placeholder="es. A3 Sportback">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Prezzo (€) *</label>
                        <input type="number" id="price" required placeholder="es. 18500">
                    </div>
                    <div class="form-group">
                        <label>Anno *</label>
                        <input type="number" id="year" required min="1980" max="2026" placeholder="es. 2021">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Chilometri *</label>
                        <input type="number" id="km" required placeholder="es. 45000">
                    </div>
                    <div class="form-group">
                        <label>Carburante *</label>
                        <select id="fuel" required>
                            <option value="Benzina">Benzina</option>
                            <option value="Diesel">Diesel</option>
                            <option value="Ibrida">Ibrida</option>
                            <option value="Elettrica">Elettrica</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>URL Immagine (opzionale)</label>
                    <input type="url" id="image" placeholder="https://esempio.com/foto-auto.jpg">
                </div>
                <div class="form-group">
                    <label>Contatto WhatsApp / Telefono *</label>
                    <input type="tel" id="phone" required placeholder="es. 393331234567">
                </div>
                <div class="form-group">
                    <label>Descrizione</label>
                    <textarea id="description" rows="3" placeholder="Condizioni, optional, tagliandi..."></textarea>
                </div>
                <button type="submit" class="btn" style="width: 100%;">Pubblica Annuncio</button>
            </form>
        </div>
    </div>

    <!-- MODALE DETTAGLI AUTO -->
    <div class="modal-overlay" id="detailModal">
        <div class="modal" id="detailContent">
            <!-- Contenuto generato via JS -->
        </div>
    </div>

    <script>
        // Annunci predefiniti
        const defaultCars = [
            {
                id: 1,
                brand: "BMW",
                model: "Serie 3 320d M-Sport",
                price: 28900,
                year: 2021,
                km: 52000,
                fuel: "Diesel",
                image: "https://images.unsplash.com/photo-1555215695-3004980ad54e?auto=format&fit=crop&w=800&q=80",
                phone: "393330000001",
                description: "Vettura in condizioni impeccabili, pacchetto M-Sport interno ed esterno, sempre tagliandata in casa madre."
            },
            {
                id: 2,
                brand: "Volkswagen",
                model: "Golf 8 1.5 eTSI",
                price: 21500,
                year: 2022,
                km: 31000,
                fuel: "Ibrida",
                image: "https://images.unsplash.com/photo-1622353219448-46a009f0d44f?auto=format&fit=crop&w=800&q=80",
                phone: "393330000002",
                description: "Unico proprietario, cambio automatico DSG, fari Matrix LED, sensori di parcheggio anteriori e posteriori."
            },
            {
                id: 3,
                brand: "Fiat",
                model: "500 1.0 Hybrid",
                price: 11900,
                year: 2021,
                km: 28000,
                fuel: "Ibrida",
                image: "https://images.unsplash.com/photo-1595787142842-7404bc60470d?auto=format&fit=crop&w=800&q=80",
                phone: "393330000003",
                description: "Perfetta per la città, consumi bassissimi, Apple CarPlay / Android Auto, tetto panoramico."
            },
            {
                id: 4,
                brand: "Tesla",
                model: "Model 3 Long Range",
                price: 34000,
                year: 2022,
                km: 41000,
                fuel: "Elettrica",
                image: "https://images.unsplash.com/photo-1560958089-b8a1929cea89?auto=format&fit=crop&w=800&q=80",
                phone: "393330000004",
                description: "Trazione integrale Dual Motor, Autopilot incluso, batteria in ottimo stato, cerchi da 19 pollici."
            }
        ];

        // Carica da localStorage o usa i predefiniti
        let cars = JSON.parse(localStorage.getItem('automarket_cars')) || defaultCars;

        function saveCars() {
            localStorage.setItem('automarket_cars', JSON.stringify(cars));
        }

        function renderCars(list) {
            const grid = document.getElementById('carsGrid');
            const count = document.getElementById('carCount');
            grid.innerHTML = '';
            count.textContent = list.length;

            if (list.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--gray); padding: 2rem;">Nessuna auto trovata con questi filtri.</p>';
                return;
            }

            list.forEach(car => {
                const formattedPrice = new Intl.NumberFormat('it-IT').format(car.price);
                const formattedKm = new Intl.NumberFormat('it-IT').format(car.km);
                const fallbackImg = "https://images.unsplash.com/photo-1494976388531-d1058494cdd8?auto=format&fit=crop&w=800&q=80";

                const card = document.createElement('div');
                card.className = 'car-card';
                card.innerHTML = `
                    <img src="${car.image || fallbackImg}" alt="${car.brand} ${car.model}" class="car-img" onerror="this.src='${fallbackImg}'">
                    <div class="car-body">
                        <div class="car-price">€ ${formattedPrice}</div>
                        <div class="car-title">${car.brand} ${car.model}</div>
                        <div class="car-specs">
                            <span>📅 ${car.year}</span>
                            <span>🛣️ ${formattedKm} km</span>
                            <span>⛽ ${car.fuel}</span>
                        </div>
                        <div class="car-footer">
                            <button class="btn" style="width: 100%;" onclick="openDetailModal(${car.id})">Vedi Dettagli</button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterCars() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const fuel = document.getElementById('fuelFilter').value;
            const maxPrice = parseFloat(document.getElementById('priceFilter').value);

            const filtered = cars.filter(car => {
                const matchText = (car.brand + ' ' + car.model).toLowerCase().includes(search);
                const matchFuel = fuel === '' || car.fuel === fuel;
                const matchPrice = car.price <= maxPrice;
                return matchText && matchFuel && matchPrice;
            });

            renderCars(filtered);
        }

        function resetFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('fuelFilter').value = '';
            document.getElementById('priceFilter').value = '999999';
            renderCars(cars);
        }

        function openSellModal() {
            document.getElementById('sellModal').classList.add('active');
        }

        function openDetailModal(id) {
            const car = cars.find(c => c.id === id);
            if (!car) return;

            const formattedPrice = new Intl.NumberFormat('it-IT').format(car.price);
            const formattedKm = new Intl.NumberFormat('it-IT').format(car.km);
            const fallbackImg = "https://images.unsplash.com/photo-1494976388531-d1058494cdd8?auto=format&fit=crop&w=800&q=80";
            const waText = encodeURIComponent(`Ciao! Sono interessato alla tua ${car.brand} ${car.model} su AutoMarket a € ${formattedPrice}.`);

            document.getElementById('detailContent').innerHTML = `
                <button class="close-btn" onclick="closeModals()">&times;</button>
                <img src="${car.image || fallbackImg}" style="width:100%; height:240px; object-fit:cover; border-radius:8px; margin-bottom:1rem;" onerror="this.src='${fallbackImg}'">
                <div class="car-price">€ ${formattedPrice}</div>
                <h2 style="margin-bottom:0.5rem;">${car.brand} ${car.model}</h2>
                <div class="car-specs">
                    <span>📅 Anno: ${car.year}</span>
                    <span>🛣️ ${formattedKm} km</span>
                    <span>⛽ ${car.fuel}</span>
                </div>
                <p style="margin-bottom:1.5rem; color: var(--dark);">${car.description || 'Nessuna descrizione aggiuntiva fornita dal venditore.'}</p>
                <a href="https://wa.me/${car.phone}?text=${waText}" target="_blank" class="btn" style="display:block; text-align:center; text-decoration:none; background-color: var(--success);">
                    Contatta su WhatsApp
                </a>
            `;
            document.getElementById('detailModal').classList.add('active');
        }

        function closeModals() {
            document.getElementById('sellModal').classList.remove('active');
            document.getElementById('detailModal').classList.remove('active');
        }

        function addCar(e) {
            e.preventDefault();
            const newCar = {
                id: Date.now(),
                brand: document.getElementById('brand').value,
                model: document.getElementById('model').value,
                price: parseFloat(document.getElementById('price').value),
                year: parseInt(document.getElementById('year').value),
                km: parseInt(document.getElementById('km').value),
                fuel: document.getElementById('fuel').value,
                image: document.getElementById('image').value,
                phone: document.getElementById('phone').value.replace(/\D/g, ''),
                description: document.getElementById('description').value
            };

            cars.unshift(newCar);
            saveCars();
            renderCars(cars);
            document.getElementById('sellForm').reset();
            closeModals();
        }

        // Chiudi modale cliccando fuori
        window.onclick = function(event) {
            if (event.target.classList.contains('modal-overlay')) {
                closeModals();
            }
        }

        // Avvio iniziale
        renderCars(cars);
    </script>
</body>
</html>
